# TEMPORARY, fork-only diagnostic for #8029 / PR #8031 review. Never for a PR.
# Runs main's single-capture archive occlusion check, as is and with only
# #8024's SwipeNavigation wrapper reverted, in CI's Playwright container.
name: diag-occlusion

on:
  push:
    branches: [diag/occlusion-8024]

permissions:
  contents: read

jobs:
  occlusion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arm: [as-is, wrapper-reverted]
        runner: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Revert only #8024's SwipeNavigation wrapper
        if: matrix.arm == 'wrapper-reverted'
        working-directory: .
        run: git apply -R diag/revert-8024-wrapper.patch && git diff --stat

      - run: npm ci

      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui

      - name: Run the archive occlusion check 10 times per variant
        run: CI=true DIAG_PUCKS=keep npx playwright test e2e/zz-diag-occlusion.spec.ts --repeat-each=10 --retries=0 --reporter=list

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.arm }}-${{ matrix.runner }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
